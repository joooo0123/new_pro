<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Little Note For You</title><link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <div class="floating-hearts" aria-hidden="true"></div>
  <main class="screen center">
    <div class="pill">A LITTLE NOTE FOR YOU ✨</div>
    <div class="card hero-card">
      <div class="sticker">💌</div>
      <p class="eyebrow">قبل أي حاجة...</p>
      <h1>ممكن نتكلم شوية؟</h1>
      <p class="lead">عارف إن بينا زعل، وعامل لك حاجة صغيرة.</p>
      <div class="question">تحبي نكمل ونسمع كلامي؟ 🥺</div>
      <div class="choice-area" id="choiceArea">
        <button class="btn primary" id="yesBtn">عايزه💗</button>
        <button class="btn soft" id="noBtn">مش عايزه</button>
      </div>
      <p class="tiny" id="homeFeedback">اختاري براحتك، مفيش أي ضغط ❤️</p>
      <div class="music-row">
        <button class="music-btn" id="musicToggle">▶ تشغيل الأغنية</button>
        <span class="tiny">الأغنية الخاصة بالمفاجأة شغالة كهدية بسيطة 🎵</span>
      </div>
      <audio id="bgMusic" src="audio/Albumaty.Com__ant_hbyby.mp3" loop preload="auto"></audio>
    </div>
    <p class="footer-note">بقالي يومين بعمل فيه💗</p>
  </main>
  <script src="script.js"></script>
</body></html>
